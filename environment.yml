# Description: Lightweight Conda launcher environment installing Nextflow, OpenJDK 21, and Python so users can run MetaNextViro with conda, mamba, docker, singularity, or apptainer profiles.

name: metanextviro
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - nextflow>=22.10.0
  - openjdk=21
  - pip
