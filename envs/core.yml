# SPDX-License-Identifier: MIT
# Description: Core surveillance, BLAST and DIAMOND annotation, Kraken2 profiling, coverage, database setup, triage, and PDF/HTML reporting environment for MetaNextViro.

name: metanextviro-core
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.11
  - fastqc
  - trim-galore
  - fastp
  - bowtie2
  - samtools
  - bedtools
  - megahit
  - kraken2
  - krona
  - blast
  - diamond
  - biopython
  - ete3
  - pandas
  - openpyxl
  - matplotlib-base
  - seaborn
  - reportlab
